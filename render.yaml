services:
  - type: web
    name: budget-tracker-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DB_PATH
        value: /var/data/productivity.db
    disk:
      name: productivity-data
      mountPath: /var/data
      sizeGB: 5

  - type: web
    name: budget-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://budget-tracker-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
